<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020617">
    <title>Activities Dashboard - Antigravity</title>
    <link rel="stylesheet" href="/static/design-system.css?v=20260318b">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/utils.js?v=20260318d"></script>
    <script src="/js/background.js"></script>
    <link rel="stylesheet" href="/static/activities.css">
    <style>
        .page-section-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 2rem;
        }

        .page-section-title {
            margin: 0;
        }

        .centrifuge-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: clamp(320px, 58vw, 500px);
            height: auto;
            padding: 1rem 0 2rem;
            position: relative;
        }

        .centrifuge-core {
            position: relative;
            width: min(100%, 300px);
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .momentum-dial {
            position: relative;
            width: min(72vw, 260px);
            height: min(72vw, 260px);
            z-index: 10;
        }

        .momentum-dial svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .dial-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 8;
        }

        .dial-progress {
            fill: none;
            stroke: var(--accent-cyan);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 283;
            stroke-dashoffset: 283;
            transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 0 8px var(--accent-cyan));
        }

        .dial-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        .dial-value {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(2.8rem, 10vw, 4.5rem);
            font-weight: 900;
            line-height: 1;
            color: white;
            text-shadow: 0 0 30px rgba(34, 211, 238, 0.3);
        }

        .dial-label {
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

        .orbit-item {
            position: absolute;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: clamp(84px, 24vw, 120px);
            height: clamp(84px, 24vw, 120px);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            z-index: 5;
            text-align: center;
            padding: 0.4rem;
        }

        .orbit-item i {
            font-size: clamp(1rem, 4vw, 1.5rem);
            margin-bottom: 0.35rem;
            color: var(--accent-cyan);
        }

        .orbit-val {
            font-family: 'Outfit';
            font-size: clamp(1rem, 4vw, 1.4rem);
            font-weight: 800;
            color: white;
        }

        .orbit-lbl {
            font-size: clamp(0.52rem, 1.9vw, 0.6rem);
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .orbit-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-cyan);
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(34, 211, 238, 0.2);
        }

        .pos-1 { top: -20%; left: 50%; transform: translateX(-50%); }
        .pos-2 { bottom: 5%; left: -10%; }
        .pos-3 { bottom: 5%; right: -10%; }

        .activities-hero {
            margin-bottom: 4rem;
            text-align: center;
        }

        .activities-hero h1 {
            margin-bottom: 0.5rem;
        }

        .activities-hero p {
            color: var(--text-secondary);
            letter-spacing: 0.28em;
            text-transform: uppercase;
            font-size: clamp(0.72rem, 2.5vw, 0.9rem);
            font-weight: 700;
        }

        .content-grid {
            margin-top: 4rem;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1.5rem;
        }

        @media (max-width: 1100px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .activities-hero {
                margin-bottom: 2.5rem;
            }

            .centrifuge-wrapper {
                padding-top: 0;
            }

            .pos-1 {
                top: -12%;
            }

            .pos-2,
            .pos-3 {
                bottom: -2%;
            }
        }

        @media (max-width: 560px) {
            .centrifuge-core {
                width: min(100%, 280px);
            }

            .momentum-dial {
                width: min(66vw, 220px);
                height: min(66vw, 220px);
            }

            .content-grid {
                margin-top: 2.5rem;
                gap: 1rem;
            }
        }

        .intel-feed-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .intel-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.25rem;
            transition: var(--t-base);
        }

        .intel-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .intel-topic {
            font-size: 0.6rem;
            color: var(--accent-cyan);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.5rem;
        }

        .intel-text {
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-primary);
        }

        .trend-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }

        .back-btn {
            position: absolute;
            top: 2rem;
            left: 2rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
    </style>
</head>
<body class="platinum-body">
    <div class="platinum-bg">
        <div class="platinum-frosted"></div>
    </div>

    <!-- Universal components will be injected here -->
    
    <div class="main-content-wrap">
        <div class="app-container">
    <div class="dashboard-container">
        <header class="activities-hero">
            <h1 class="gradient-text">
                Relationship <span style="color: var(--accent-cyan);">Momentum</span>
            </h1>
            <p>The Platinum Pulse</p>
        </header>

        <!-- Centrifuge Layout -->
        <div class="centrifuge-wrapper">
            <div class="centrifuge-core">
                <div class="momentum-dial">
                    <svg viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="45" class="dial-bg"></circle>
                        <circle cx="50" cy="50" r="45" class="dial-progress" id="momentum-progress"></circle>
                    </svg>
                    <div class="dial-content">
                        <span class="dial-value" id="total-momentum">0</span>
                        <span class="dial-label" id="current-period">MORNING</span>
                    </div>
                </div>

                <!-- Orbiting Stats -->
                <div class="orbit-item pos-1" id="stat-people">
                    <i class="fas fa-users"></i>
                    <div class="orbit-data">
                        <span class="orbit-val">0</span>
                        <span class="orbit-lbl">PROFILES</span>
                    </div>
                </div>
                <div class="orbit-item pos-2" id="stat-interactions">
                    <i class="fas fa-comment-dots"></i>
                    <div class="orbit-data">
                        <span class="orbit-val">0</span>
                        <span class="orbit-lbl">INPUTS</span>
                    </div>
                </div>
                <div class="orbit-item pos-3" id="stat-intel">
                    <i class="fas fa-brain"></i>
                    <div class="orbit-data">
                        <span class="orbit-val">0</span>
                        <span class="orbit-lbl">INTEL</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="content-grid">
            <!-- Intel Feed -->
            <section class="intel-feed-section">
                <div class="page-section-head">
                    <h2 class="page-section-title">
                        Latest <span style="color: var(--accent-cyan);">Intelligence Feed</span>
                    </h2>
                </div>
                <div id="intel-feed" class="intel-feed-grid">
                    <!-- Dynamic intel nuggets -->
                </div>
            </section>

            <!-- Sentiment Trends -->
            <section class="trend-section">
                <h2 class="page-section-title" style="margin-bottom: 2rem;">
                    Sentiment <span style="color: var(--accent-cyan);">Momentum</span>
                </h2>
                <div class="trend-grid" id="trend-grid">
                    <!-- Dynamic cards -->
                </div>
            </section>
        </div>
    </div>
        </div>
    </div>
    <script src="/js/activities.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderUniversalLayout('analytics', 'ACTIVITIES & STRATEGIC MOMENTUM');
        });
    </script>
</body>
</html>
