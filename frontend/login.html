<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Antigravity CRM</title>
    <meta name="description" content="Relationship Intelligence Platform — Sign in to your account">
    <link rel="stylesheet" href="/static/design-system.css?v=20260318b">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-5);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: var(--space-8);
        }

        .login-card .input-label {
            color: rgba(15, 23, 42, 0.36);
            font-weight: 700;
        }

        .login-card .input {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(59, 130, 246, 0.14);
            color: #0f172a;
            font-weight: 600;
        }

        .login-card .input::placeholder {
            color: rgba(15, 23, 42, 0.24);
        }

        .login-card .input:focus {
            border-color: rgba(59, 130, 246, 0.45);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        .login-card input:-webkit-autofill,
        .login-card input:-webkit-autofill:hover,
        .login-card input:-webkit-autofill:focus,
        .login-card input:-webkit-autofill:active {
            -webkit-text-fill-color: #0f172a;
            -webkit-box-shadow: 0 0 0 1000px rgba(255, 255, 255, 0.92) inset;
            transition: background-color 9999s ease-in-out 0s;
            caret-color: #0f172a;
        }

        .logo-area {
            text-align: center;
            margin-bottom: var(--space-8);
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue), var(--accent-violet));
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-4);
            font-size: 28px;
        }

        .logo-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: var(--space-1);
        }

        .logo-sub {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: var(--space-5);
        }

        .setup-note {
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.2);
            border-radius: var(--radius-md);
            padding: var(--space-4);
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: var(--space-5);
            line-height: 1.6;
        }

        .setup-note strong {
            color: var(--accent-cyan);
        }

        .login-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: var(--space-5) 0;
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
    <script src="/js/background.js?v=20260313a"></script>
    <script src="/static/utils.js?v=20260318d"></script>
</head>

<body class="platinum-body">
    <!-- Platinum Global Background -->
    <div class="platinum-bg">
        <div class="platinum-frosted"></div>
    </div>

    <div class="login-page">
        <div class="login-card glass-strong">
            <div class="logo-area">
                <div class="logo-icon">⚡</div>
                <h1 class="logo-title gradient-text">Antigravity CRM</h1>
                <p class="logo-sub">Relationship Intelligence Platform</p>
            </div>

            <div id="setup-note" class="setup-note" style="display:none">
                <strong>First launch!</strong> Create your admin account to get started.
                This only appears once.
            </div>

            <form id="login-form" novalidate>
                <div id="name-group" class="form-group" style="display:none">
                    <div class="input-group">
                        <label class="input-label" for="full-name">Your Name</label>
                        <input type="text" id="full-name" class="input" placeholder="Marcus Johnson"
                            autocomplete="name">
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-group">
                        <label class="input-label" for="email">Email Address</label>
                        <input type="email" id="email" class="input" placeholder="you@example.com" autocomplete="email"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-group">
                        <label class="input-label" for="password">Password</label>
                        <input type="password" id="password" class="input" placeholder="••••••••"
                            autocomplete="current-password" required>
                    </div>
                </div>

                <div id="error-msg" style="display:none;color:#f87171;font-size:13px;margin-bottom:var(--space-4)">
                </div>

                <button type="submit" id="submit-btn" class="btn btn-accent w-full btn-lg">
                    <span id="btn-text">Sign In</span>
                    <div id="btn-spinner" class="spinner" style="display:none;width:16px;height:16px;border-width:2px">
                    </div>
                </button>
            </form>

            <div id="microsoft-wrap" style="display:none">
                <div class="login-divider">or</div>
                <button type="button" id="microsoft-btn" class="btn btn-secondary w-full btn-lg">
                    Sign In With Microsoft
                </button>
            </div>
        </div>
    </div>

    <script>
        let isSetupMode = false;
        let microsoftOauthEnabled = false;

        async function validateExistingSession() {
            if (!auth.getUser()) return;
            try {
                const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
                if (!res.ok) {
                    throw new Error(`Session check failed (${res.status})`);
                }
                const user = await res.json();
                auth.setUser(user);
                window.location.replace('/');
            } catch (_err) {
                localStorage.removeItem('ag_user');
            }
        }

        async function checkSetup() {
            try {
                const res = await fetch('/api/auth/status');
                const data = await res.json();
                microsoftOauthEnabled = !!data.microsoft_oauth_enabled;
                document.getElementById('microsoft-wrap').style.display = microsoftOauthEnabled ? 'block' : 'none';
                if (data.needs_setup) {
                    isSetupMode = true;
                    document.getElementById('setup-note').style.display = 'block';
                    document.getElementById('name-group').style.display = 'block';
                    document.getElementById('btn-text').textContent = 'Create Account';
                    document.querySelector('.logo-sub').textContent = 'First-time setup';
                    document.getElementById('password').setAttribute('autocomplete', 'new-password');
                }
            } catch (e) {
                console.error('Status check failed:', e);
            }
        }

        document.getElementById('microsoft-btn').addEventListener('click', () => {
            window.location.href = '/api/auth/microsoft/start';
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errEl = document.getElementById('error-msg');
            const spinner = document.getElementById('btn-spinner');
            const btnText = document.getElementById('btn-text');

            errEl.style.display = 'none';
            btn.disabled = true;
            spinner.style.display = 'block';
            btnText.style.opacity = '0.5';

            try {
                let result;
                if (isSetupMode) {
                    result = await post('/api/auth/setup', {
                        email: document.getElementById('email').value.trim(),
                        full_name: document.getElementById('full-name').value.trim(),
                        password: document.getElementById('password').value,
                    });
                } else {
                    result = await post('/api/auth/login', {
                        email: document.getElementById('email').value.trim(),
                        password: document.getElementById('password').value,
                    });
                }
                auth.setUser(result.user);
                window.location.href = '/';
            } catch (err) {
                errEl.textContent = err.message;
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.style.opacity = '1';
            }
        });

        const loginParams = new URLSearchParams(window.location.search);
        const oauthError = loginParams.get('error');
        if (oauthError) {
            const errEl = document.getElementById('error-msg');
            errEl.textContent = oauthError.replaceAll('_', ' ');
            errEl.style.display = 'block';
        }

        validateExistingSession().finally(checkSetup);
    </script>
</body>

</html>
