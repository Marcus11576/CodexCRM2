<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="description" content="Antigravity CRM Agenda - your relationship action diary">
    <title>Agenda | Antigravity</title>
    <script src="/static/utils.js?v=20260318d"></script>
    <script src="/js/background.js?v=20260311u"></script>
    <link rel="stylesheet" href="/static/design-system.css?v=20260318b">
    <link rel="stylesheet" href="/static/agenda.css?v=20260323d">
</head>

<body>
    <div class="platinum-bg">
        <div class="platinum-frosted"></div>
    </div>

    <div class="main-content-wrap">
        <div class="app">
            <!-- Universal components will be injected here -->

        <!-- MAIN -->
        <div class="main">

            <!-- LEFT: CALENDAR -->
            <div>
                <div class="cal-panel">
                    <div class="cal-header">
                        <button class="cal-nav" onclick="prevMonth()">&lt;</button>
                        <div class="cal-title" id="cal-title"></div>
                        <button class="cal-nav" onclick="nextMonth()">&gt;</button>
                    </div>
                    <div class="cal-grid" id="cal-grid"></div>

                    <div class="view-row">
                        <button class="view-btn active" id="vb-day" onclick="setView('day')">Day</button>
                        <button class="view-btn" id="vb-week" onclick="setView('week')">Week</button>
                        <button class="view-btn" id="vb-all" onclick="setView('all')">All</button>
                    </div>

                    <div class="mini-panel">
                        <div class="mini-label">Upcoming</div>
                        <div id="mini-list"></div>
                    </div>
                </div>
            </div>

            <!-- RIGHT: TASKS -->
            <div class="right-panel">

                <div class="panel-header">
                    <div>
                        <div class="day-label" id="panel-title">Today</div>
                        <div class="day-sub" id="panel-sub"></div>
                    </div>
                    <div class="filter-pills">
                        <button class="fpill active" id="fp-active" onclick="setFilter('active')">Open + Doing</button>
                        <button class="fpill" id="fp-open" onclick="setFilter('open')">Open</button>
                        <button class="fpill" id="fp-in_progress" onclick="setFilter('in_progress')">Doing</button>
                        <button class="fpill" id="fp-done" onclick="setFilter('done')">Done</button>
                        <button class="fpill" id="fp-all" onclick="setFilter('all')">All</button>
                    </div>
                </div>

                <div class="agenda-alarm-shell" id="agenda-alarm-shell">
                    <div class="agenda-alarm-main">
                        <div class="agenda-alarm-kicker">Task Alarm</div>
                        <div class="agenda-alarm-clock" id="agenda-alarm-clock">--:--:--</div>
                        <div class="agenda-alarm-next" id="agenda-alarm-next">No timed tasks pending.</div>
                    </div>
                    <div class="agenda-alarm-actions">
                        <button id="agenda-notify-btn" class="agenda-alarm-btn" type="button" onclick="toggleAgendaBrowserAlerts()">Enable Browser Alerts</button>
                    </div>
                </div>
                <div id="agenda-alarm-feed" class="agenda-alarm-feed" hidden></div>

                <div class="agenda-search-shell">
                <div class="agenda-search-row">
                    <input id="task-search-input" class="agenda-search-input" type="search" placeholder="Search tasks by contact, employer, or task text" oninput="setAgendaSearch(this.value)">
                    <button id="task-search-clear" class="agenda-search-clear" type="button" onclick="clearAgendaSearch()" hidden>Clear</button>
                </div>
                <div id="task-search-context" class="agenda-search-context" hidden></div>
                </div>

                <div id="week-strip-wrap" style="display:none;">
                    <div class="week-strip-wrap">
                        <div class="week-strip" id="week-strip"></div>
                    </div>
                </div>

                <div id="task-list">
                    <div class="shimmer"></div>
                    <div class="shimmer" style="opacity:.6;"></div>
                    <div class="shimmer" style="opacity:.3;"></div>
                </div>

            </div>
        </div>
    </div>

    <!-- ADD TASK MODAL -->
    <div class="overlay" id="modal" onclick="overlayClose(event)">
        <div class="sheet">
            <div class="handle"></div>
            <div class="modal-title">New Task</div>

            <div class="fgroup">
                <label class="flabel">Task Description *</label>
                <textarea class="ftarea" id="f-text" placeholder="Call Ahmed re: Q2 plan, send brief to Maysa..."
                    rows="2"></textarea>
            </div>

            <div class="fgroup psearch-wrap">
                <label class="flabel">Link to Contact (optional)</label>
                <input class="finput" id="f-person-q" placeholder="Search by name..." oninput="personSearch(this.value)"
                    autocomplete="off">
                <div class="person-drop" id="person-drop" style="display:none;"></div>
                <input type="hidden" id="f-person-id">
                <div id="f-person-chip" style="margin-top:5px;font-size:0.72rem;color:var(--accent-cyan);display:none;">
                </div>
            </div>

            <div class="fgroup">
                <label class="flabel">Due Date & Time</label>
                <!-- Segment quick-select -->
                <div class="seg-quick" id="seg-quick">
                    <button class="seg-q-btn" id="sq-morning" onclick="setSegment('morning')">
                        <span class="seg-q-icon">AM</span><span>Morning</span><span class="seg-q-time">09:00</span>
                    </button>
                    <button class="seg-q-btn" id="sq-afternoon" onclick="setSegment('afternoon')">
                        <span class="seg-q-icon">PM</span><span>Afternoon</span><span class="seg-q-time">13:00</span>
                    </button>
                </div>
                <div class="datetime-row">
                    <input class="finput" type="date" id="f-date" placeholder="Date">
                    <input class="finput" type="time" id="f-time" placeholder="Time (optional)">
                </div>
            </div>

            <div class="fgroup">
                <label class="flabel">Priority</label>
                <div class="pri-row">
                    <button class="pbtn" id="pb-high" onclick="setPri('high')">High</button>
                    <button class="pbtn" id="pb-medium" onclick="setPri('medium')">Medium</button>
                    <button class="pbtn" id="pb-low" onclick="setPri('low')">Low</button>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-sec" onclick="closeModal()">Cancel</button>
                <button class="btn-pri" onclick="saveTask()">Save Task</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script src="/js/agenda.js?v=20260323d"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderUniversalLayout('agenda', 'AGENDA & STRATEGIC TASKS');
        });
    </script>
</body>

</html>
