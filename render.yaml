services:
  - type: web
    name: codexcrm2
    env: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: AUTH_DISABLED
        value: false
      - key: COOKIE_SECURE
        value: true
      - key: DB_PATH
        value: /var/data/crm.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: BACKUP_EXTERNAL_DIR
        value: /var/data/backups_external
      - key: PORT
        value: 8009
      - key: SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: M365_CLIENT_ID
        sync: false
      - key: M365_TENANT_ID
        sync: false
      - key: M365_CLIENT_SECRET
        sync: false
    disk:
      name: codexcrm2-data
      mountPath: /var/data
      sizeGB: 5
